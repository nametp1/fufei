<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的 - SanVIST APP</title>
    <style>
        :root {
            --primary: #2F80ED;
            --primary-hover: #1B62C4;
            --primary-light: #EAF2FE;
            --success: #10B981;
            --success-light: #D1FAE5;
            --warning: #F59E0B;
            --warning-light: #FEF3C7;
            --error: #EF4444;
            --error-light: #EAF2FE;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --border-light: #F1F5F9;
            --bg-page: #F5F5F7;
            --bg-card: #FFFFFF;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --transition-fast: 200ms cubic-bezier(.25, .1, .25, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-page)
        }

        .app-page {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            overflow-x: hidden;
            background: var(--bg-page);
            position: relative;
            padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px))
        }

        /* Header */
        .page-header {
            padding: 20px 16px 12px
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px
        }

        .header-logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -.5px
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px
        }

        .header-action-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 50%
        }

        .header-action-btn:active {
            background: var(--border-light)
        }

        /* Profile */
        .profile-card {
            margin: 0 16px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden
        }

        .profile-main {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            flex-shrink: 0;
            position: relative
        }

        .avatar-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: var(--error);
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .avatar-badge svg {
            width: 10px;
            height: 10px;
            color: #fff
        }

        .profile-info {
            flex: 1;
            min-width: 0
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3
        }

        .profile-role {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px
        }

        /* 当前订阅套餐（头像区域） */
        .profile-plan {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 10px 4px 6px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity var(--transition-fast)
        }

        .profile-plan:active {
            opacity: .85
        }

        .profile-plan-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0
        }

        .profile-plan-icon svg {
            width: 11px;
            height: 11px
        }

        .profile-plan-name {
            line-height: 1
        }

        .profile-plan-tag {
            font-size: 10px;
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            padding: 1px 6px;
            border-radius: 100px;
            line-height: 1.5
        }

        .profile-plan-arrow {
            color: var(--primary);
            line-height: 1
        }

        .profile-switch {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            flex-shrink: 0
        }

        /* Subscription Banner */
        .sub-banner {
            margin: 0 16px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden
        }

        .sub-banner-inner {
            padding: 16px
        }

        .sub-banner-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px
        }

        .sub-banner-title {
            font-size: 15px;
            font-weight: 600
        }

        .sub-banner-title .sub-highlight {
            color: var(--primary);
            font-size: 18px;
            font-weight: 800
        }

        .sub-banner-btn {
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 2px
        }

        .sub-calendar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch
        }

        .cal-day {
            flex: 0 0 auto;
            text-align: center;
            padding: 4px 6px;
            min-width: 36px
        }

        .cal-date {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px
        }

        .cal-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2px;
            color: var(--text-muted)
        }

        .cal-icon.active {
            background: var(--warning-light);
            color: #D97706
        }

        .cal-icon.checked {
            background: var(--success);
            color: #fff
        }

        .cal-val {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted)
        }

        .cal-val.positive {
            color: var(--success)
        }

        .sub-cta {
            display: block;
            width: 100%;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, #FF7A00, #FF5500);
            color: #fff;
            text-align: center;
            transition: opacity .2s
        }

        .sub-cta:active {
            opacity: .85
        }

        /* Quick Actions */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 0 16px 12px
        }

        .quick-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background var(--transition-fast)
        }

        .quick-item:active {
            background: var(--border-light)
        }

        .quick-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .quick-icon.blue {
            background: #EFF6FF;
            color: #2563EB
        }

        .quick-icon.orange {
            background: #FFF7ED;
            color: #EA580C
        }

        .quick-icon.green {
            background: #ECFDF5;
            color: #059669
        }

        .quick-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary)
        }

        /* Quick Menu List */
        .menu-card {
            margin: 0 16px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: background var(--transition-fast)
        }

        .menu-item:active {
            background: var(--border-light)
        }

        .menu-item+.menu-item {
            border-top: 1px solid var(--border-light)
        }

        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0
        }

        .menu-icon.blue {
            background: #EFF6FF
        }

        .menu-icon.purple {
            background: #F3E8FF
        }

        .menu-icon.orange {
            background: #FFF7ED
        }

        .menu-icon.red {
            background: #F5F9FF
        }

        .menu-icon.blue-light {
            background: #EFF6FF
        }

        .menu-icon.red-light {
            background: #F5F9FF
        }

        .menu-icon.cyan {
            background: #ECFEFF
        }

        .menu-icon.green {
            background: #ECFDF5
        }

        .menu-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500
        }

        .menu-badge {
            font-size: 11px;
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            padding: 2px 10px;
            border-radius: 100px
        }

        /* Stats */
        .stats-card {
            margin: 0 16px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden
        }

        .stats-header {
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-light)
        }

        .stats-body {
            display: flex;
            padding: 16px
        }

        .stat-col {
            flex: 1;
            text-align: center
        }

        .stat-num {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px
        }

        /* Bottom Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            max-width: 100%;
            margin: 0 auto;
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        .tab-list {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 0 4px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            font-family: inherit;
            font-size: 10px
        }

        .tab-item.active {
            color: var(--primary)
        }

        .tab-icon {
            width: 24px;
            height: 24px
        }

        .tab-dot {
            position: absolute;
            top: 2px;
            right: calc(50% - 18px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--error);
            border: 2px solid var(--bg-card)
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 100%;
            background: #1E293B;
            color: #fff;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            text-align: center;
            z-index: 300;
            animation: toastIn .2s;
            pointer-events: none;
            display: none
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .toast.visible {
            display: block
        }

        *:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px
        }
    </style>
</head>

<body>

    <div class="app-page">

        <!-- Header -->
        <div class="page-header">
            <div class="header-top">
                <div class="header-logo">SanVIST</div>
                <div class="header-actions">
                    <button class="header-action-btn" title="客服" onclick="showToast('正在连接在线客服...')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                        </svg>
                    </button>
                    <button class="header-action-btn" title="设置" onclick="showToast('打开系统设置')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Profile -->
        <div class="profile-card">
            <div class="profile-main">
                <div class="avatar">阿
                    <div class="avatar-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3">
                            <polyline points="20 6 9 17 4 12" />
                        </svg></div>
                </div>
                <div class="profile-info">
                    <div class="profile-name">阿利集</div>
                    <span class="profile-role">个体户</span>
                    <div class="profile-plan" onclick="goMySubscription()">
                        <span class="profile-plan-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg></span>
                        <span class="profile-plan-name">订阅</span>
                        <span class="profile-plan-tag">订阅中</span>
                        <span class="profile-plan-arrow">›</span>
                    </div>
                </div>
                <button class="profile-switch" title="切换账号" onclick="showToast('切换账号')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 16V4m0 0L3 8m4-4l4 4" />
                        <path d="M17 8v12m0 0l4-4m-4 4l-4-4" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Subscription Banner (签到/订阅入口) -->
        <div class="sub-banner">
            <div class="sub-banner-inner">
                <div class="sub-banner-top">
                    <div class="sub-banner-title">我的星星 <span class="sub-highlight">20</span> ≈ Rp 3.620,-</div>
                    <span class="sub-banner-btn" onclick="goSubscribe()">立即查看 ›</span>
                </div>
                <!-- Calendar strip -->
                <div class="sub-calendar" id="cal-strip"></div>
                <!-- CTA Button -->
                <button class="sub-cta" onclick="showToast('已领取 10 颗星星！')">领取 10 颗星星</button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-grid">
            <div class="quick-item" onclick="showToast('绑定设备')">
                <div class="quick-icon blue">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                    </svg>
                </div>
                <span class="quick-label">绑定设备</span>
            </div>
            <div class="quick-item" onclick="showToast('设备预警')">
                <div class="quick-icon orange">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                        <line x1="12" y1="9" x2="12" y2="13" />
                        <line x1="12" y1="17" x2="12.01" y2="17" />
                    </svg>
                </div>
                <span class="quick-label">设备预警</span>
            </div>
            <div class="quick-item" onclick="goFleetReport()">
                <div class="quick-icon green">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10" />
                        <line x1="12" y1="20" x2="12" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="14" />
                    </svg>
                </div>
                <span class="quick-label">机群报表</span>
            </div>
        </div>

        <!-- Device Stats -->
        <div class="stats-card">
            <div class="stats-header">设备管理</div>
            <div class="stats-body">
                <div class="stat-col">
                    <div class="stat-num">0</div>
                    <div class="stat-label">待保养</div>
                </div>
                <div class="stat-col">
                    <div class="stat-num">0</div>
                    <div class="stat-label">服务工单</div>
                </div>
            </div>
        </div>

        <!-- Quick Menu Group 1: 交易 -->
        <div class="menu-card">
            <div class="menu-item" onclick="showToast('主机询价')">
                <div class="menu-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB"
                        stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg></div>
                <span class="menu-name">主机询价</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </div>
            <div class="menu-item" onclick="showToast('主机交付')">
                <div class="menu-icon purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="#7C3AED" stroke-width="2">
                        <rect x="3" y="5" width="18" height="14" rx="2" />
                        <line x1="8" y1="10" x2="16" y2="10" />
                        <line x1="8" y1="14" x2="12" y2="14" />
                    </svg></div>
                <span class="menu-name">主机交付</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </div>
            <div class="menu-item" onclick="showToast('配件交付')">
                <div class="menu-icon orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="#EA580C" stroke-width="2">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15" />
                    </svg></div>
                <span class="menu-name">配件交付</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </div>
        </div>

        <!-- Quick Menu Group 2: 服务 -->
        <div class="menu-card">
            <div class="menu-item" onclick="goFleetReport()">
                <div class="menu-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="#2563EB" stroke-width="2">
                        <path d="M3 3v18h18" />
                        <path d="M18.7 8l-5.1 5.2-2.8-2.7L6 15.2" />
                    </svg></div>
                <span class="menu-name">机群报表</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2">
                    <polyline points="9 18 15 12 9 6" />

    <script>
        // ===== 日历条渲染 =====
        (function buildCalendar() {
            const strip = document.getElementById('cal-strip');
            const days = ['8.15', '8.16', '8.17', '8.18', '8.19', '8.20', '今天'];
            const icons = ['star', 'star', 'star', 'star', 'checked', 'active', 'star'];
            const vals = ['+0', '+0', '+0', '+0', '', '+10', '+0'];
            let html = '';
            for (let i = 0; i < days.length; i++) {
                const iconType = icons[i];
                let iconSvg = '';
                if (iconType === 'star' || iconType === 'active') {
                    iconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="' + (iconType === 'active' ? '#D97706' : 'none') + '" stroke="' + (iconType === 'active' ? '#D97706' : '#94A3B8') + '" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
                } else if (iconType === 'checked') {
                    iconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
                }
                html += '<div class="cal-day">' +
                    '<div class="cal-date">' + days[i] + '</div>' +
                    '<div class="cal-icon ' + iconType + '">' + iconSvg + '</div>' +
                    '<div class="cal-val ' + (vals[i].includes('+') ? 'positive' : '') + '">' + vals[i] + '</div>' +
                    '</div>';
            }
            strip.innerHTML = html;
        })();

        // ===== 跳转 =====
        function goSubscribe() { window.location.href = '我的订阅管理页.html'; }
        function goMySubscription() { window.location.href = '我的订阅管理页.html'; }
        function goFleetReport() { window.location.href = '机群报表页.html'; }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 1800);
        }
    </script>
